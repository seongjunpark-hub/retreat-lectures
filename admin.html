<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>특강 관리자</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <p class="eyebrow">관리자</p>
  <h1>선택특강 관리</h1>
</div></header>

<main class="wrap">
  <!-- 로그인 -->
  <section id="loginBox" class="card hidden">
    <h2>관리자 로그인</h2>
    <div class="grid">
      <div class="full"><label for="email">이메일</label><input id="email" type="email" autocomplete="username"></div>
      <div class="full"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div>
    </div>
    <div class="actions"><button id="loginBtn">로그인</button></div>
  </section>

  <div id="app" class="hidden">
    <div class="tabs">
      <button data-tab="lectures" class="on">특강 관리</button>
      <button data-tab="enrolls">신청 현황</button>
      <button data-tab="settings">신청 설정</button>
      <button id="logout" class="ghost" style="margin-left:auto">로그아웃</button>
    </div>

    <!-- 특강 관리 -->
    <section data-pane="lectures">
      <div class="card">
        <h2 id="formTitle">특강 등록</h2>
        <div class="grid">
          <div class="full"><label>정원 (명)</label><input id="f_capacity" type="number" min="1" inputmode="numeric" value="15"></div>
          <div class="full"><label>특강 제목</label><input id="f_title"></div>
          <div class="full"><label>특강 내용</label><textarea id="f_description"></textarea></div>
          <div><label>강사 이름</label><input id="f_speaker_name"></div>
          <div><label>강사 연락처 (학생에게 비공개)</label><input id="f_speaker_contact"></div>
          <div class="full"><label>강사 약력</label><textarea id="f_speaker_bio"></textarea></div>
          <div><label>장소</label><input id="f_location"></div>
          <div><label>표시 순서 (작을수록 위)</label><input id="f_sort_order" type="number" value="0"></div>
        </div>
        <p class="hint">학생은 전체 특강 중 1개만 신청할 수 있어요.</p>
        <div class="actions"><button id="saveLec">등록</button><button class="ghost hidden" id="cancelEdit">수정 취소</button></div>
      </div>
      <div id="lecList"></div>
    </section>

    <!-- 신청 현황 -->
    <section data-pane="enrolls" class="hidden">
      <div class="card">
        <div class="stat" id="stats"></div>
        <div id="breakdown" style="margin-top:14px"></div>
        <div class="actions"><button id="refreshEn" class="ghost">새로고침</button><button id="csv">CSV 다운로드</button></div>
      </div>
      <div id="enList"></div>
    </section>

    <!-- 설정 -->
    <section data-pane="settings" class="hidden">
      <div class="card">
        <div class="grid">
          <div class="full"><label>행사 이름</label><input id="s_event_title"></div>
          <div class="full"><label>안내 문구 (학생 화면 상단)</label><textarea id="s_notice"></textarea></div>
          <div><label>신청 시작</label><input id="s_open_at" type="datetime-local"></div>
          <div><label>신청 마감 (비우면 계속 열림)</label><input id="s_close_at" type="datetime-local"></div>
          <div class="full"><label>입장 코드 (비우면 사용 안 함)</label><input id="s_access_code" placeholder="예: 은혜2026"></div>
        </div>
        <p class="hint">입장 코드는 현장에서만 알려 주면 외부인이 자리를 채우는 걸 막을 수 있어요. 시간은 이 기기 시간대(한국) 기준입니다.</p>
        <div class="actions"><button id="saveSet">저장</button></div>
      </div>
    </section>
  </div>
</main>
<div id="toast"></div>

<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000); }
let lectures = [], enrolls = [], editingId = null;

// ---------- 로그인 ----------
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#loginBox').classList.remove('hidden'); $('#app').classList.add('hidden'); return; }
  const { data: ok } = await sb.rpc('is_admin');
  if (!ok) { toast('관리자로 등록되지 않은 계정이에요.'); await sb.auth.signOut(); $('#loginBox').classList.remove('hidden'); return; }
  $('#loginBox').classList.add('hidden'); $('#app').classList.remove('hidden');
  await loadLectures();
  await Promise.all([loadSettings(), loadEnrolls()]);
}
$('#loginBtn').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pw').value });
  if (error) { toast('로그인 실패: 이메일/비밀번호를 확인하세요.'); return; }
  boot();
};
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });
$('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// ---------- 탭 ----------
$$('.tabs button[data-tab]').forEach(b => b.onclick = () => {
  $$('.tabs button[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  $$('[data-pane]').forEach(p => p.classList.toggle('hidden', p.dataset.pane !== b.dataset.tab));
  if (b.dataset.tab === 'enrolls') loadEnrolls();
});

// ---------- 특강 ----------
const LF = ['title','description','speaker_name','speaker_contact','speaker_bio','location','capacity','sort_order'];
async function loadLectures(){
  const { data, error } = await sb.from('lectures').select('*').order('sort_order').order('created_at');
  if (error) { toast('특강을 불러오지 못했어요.'); return; }
  lectures = data; renderLectures();
}
function countFor(id){ return enrolls.filter(e => e.lecture_id === id).length; }
function renderLectures(){
  $('#lecList').innerHTML = lectures.length ? lectures.map(l => `
    <article class="lec">
      <h3>${esc(l.title)}</h3>
      <p class="speaker">${esc(l.speaker_name)}${l.speaker_contact ? ' · ' + esc(l.speaker_contact) : ''}${l.location ? ' · ' + esc(l.location) : ''}</p>
      <div class="row" style="margin-top:10px"><span class="count"><b>${countFor(l.id)}</b> / ${l.capacity}명</span>
        <span><button class="ghost" data-edit="${l.id}">수정</button> <button class="danger" data-del="${l.id}">삭제</button></span></div>
    </article>`).join('') : '<div class="card empty">등록된 특강이 없어요. 위에서 첫 특강을 등록해 보세요.</div>';
}
function resetForm(){
  editingId = null;
  LF.forEach(f => $('#f_' + f).value = f === 'sort_order' ? '0' : f === 'capacity' ? '15' : '');
  $('#formTitle').textContent = '특강 등록'; $('#saveLec').textContent = '등록'; $('#cancelEdit').classList.add('hidden');
}
$('#saveLec').onclick = async () => {
  const row = {};
  LF.forEach(f => row[f] = $('#f_' + f).value.trim());
  row.capacity = parseInt(row.capacity, 10); row.sort_order = parseInt(row.sort_order, 10) || 0;
  if (!row.title || !row.speaker_name || !(row.capacity > 0)) { toast('제목, 강사 이름, 정원은 꼭 입력해 주세요.'); return; }
  const q = editingId ? sb.from('lectures').update(row).eq('id', editingId) : sb.from('lectures').insert(row);
  const { error } = await q;
  if (error) { toast('저장 실패: ' + error.message); return; }
  toast(editingId ? '수정했어요.' : '등록했어요.'); resetForm(); loadLectures();
};
$('#cancelEdit').onclick = resetForm;
$('#lecList').onclick = async e => {
  const ed = e.target.closest('[data-edit]')?.dataset.edit, del = e.target.closest('[data-del]')?.dataset.del;
  if (ed) {
    const l = lectures.find(x => x.id === ed); editingId = ed;
    LF.forEach(f => $('#f_' + f).value = l[f] ?? '');
    $('#formTitle').textContent = '특강 수정'; $('#saveLec').textContent = '수정 저장'; $('#cancelEdit').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  if (del) {
    const n = countFor(del);
    if (!confirm(n ? `신청자 ${n}명의 신청 내역도 함께 삭제돼요. 삭제할까요?` : '이 특강을 삭제할까요?')) return;
    const { error } = await sb.from('lectures').delete().eq('id', del);
    if (error) toast('삭제 실패: ' + error.message); else { toast('삭제했어요.'); loadLectures(); loadEnrolls(); }
  }
};

// ---------- 신청 현황 ----------
async function loadEnrolls(){
  const { data, error } = await sb.from('enrollments').select('*').order('created_at');
  if (error) { toast('신청 현황을 불러오지 못했어요.'); return; }
  enrolls = data; renderEnrolls(); renderLectures();
}
function renderEnrolls(){
  const students = new Set(enrolls.map(e => e.student_name + '|' + e.student_phone)).size;
  const cap = lectures.reduce((a, l) => a + l.capacity, 0);
  $('#stats').innerHTML = `<div><b>${students}</b><span>신청한 학생 수</span></div><div><b>${cap}</b><span>전체 정원</span></div>`;
  // 학생 단위(이름+번호)로 지구 × 등록상태 집계 — 가장 최근 신청의 값을 사용
  const people = new Map();
  enrolls.forEach(e => people.set(e.student_name + '|' + e.student_phone, e));
  const ORDER = ['안동','영주','경주','김천구미','포항'];
  const dKey = d => ORDER.includes(d) ? d : (d ? '그외' : '미입력');
  const tbl = {};
  people.forEach(e => { const k = dKey(e.district); tbl[k] ??= { 가등록: 0, 등록: 0, etc: new Set() };
    if (e.reg_status === '등록') tbl[k].등록++; else tbl[k].가등록++;
    if (k === '그외') tbl[k].etc.add(e.district.replace(/^그외\(|\)$/g, '')); });
  const keys = [...ORDER, '그외', '미입력'].filter(k => tbl[k]);
  const tot = { 가등록: 0, 등록: 0 }; keys.forEach(k => { tot.가등록 += tbl[k].가등록; tot.등록 += tbl[k].등록; });
  $('#breakdown').innerHTML = keys.length ? `<table><tr><th>출신 지구</th><th>가등록</th><th>등록</th><th>합계</th></tr>
    ${keys.map(k => `<tr><td>${esc(k)}${k === '그외' && tbl[k].etc.size ? `<br><small style="color:var(--muted)">${esc([...tbl[k].etc].join(', '))}</small>` : ''}</td>
      <td>${tbl[k].가등록}</td><td>${tbl[k].등록}</td><td><b>${tbl[k].가등록 + tbl[k].등록}</b></td></tr>`).join('')}
    <tr><td><b>합계</b></td><td><b>${tot.가등록}</b></td><td><b>${tot.등록}</b></td><td><b>${tot.가등록 + tot.등록}</b></td></tr></table>` : '';
  const phone = p => p.length === 11 ? p.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3') : p;
  const time = iso => new Date(iso).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  $('#enList').innerHTML = lectures.map(l => {
    const rows = enrolls.filter(e => e.lecture_id === l.id);
    return `<div class="card"><h3>${esc(l.title)}</h3><p class="speaker">${esc(l.speaker_name)} · <b>${rows.length}</b>/${l.capacity}명</p>
      ${rows.length ? `<table style="margin-top:10px"><tr><th>#</th><th>이름</th><th>연락처</th><th>등록</th><th>지구</th><th>신청시각</th><th></th></tr>
      ${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.student_name)}</td><td>${esc(phone(r.student_phone))}</td><td>${esc(r.reg_status)}</td><td>${esc(r.district)}</td><td>${time(r.created_at)}</td>
        <td><button class="danger" style="padding:4px 8px;font-size:12px" data-rm="${r.id}">삭제</button></td></tr>`).join('')}</table>`
      : '<p class="empty">아직 신청자가 없어요.</p>'}</div>`;
  }).join('');
}
$('#refreshEn').onclick = loadEnrolls;
$('#enList').onclick = async e => {
  const id = e.target.closest('[data-rm]')?.dataset.rm;
  if (!id || !confirm('이 신청을 삭제할까요?')) return;
  const { error } = await sb.from('enrollments').delete().eq('id', id);
  if (error) toast('삭제 실패'); else loadEnrolls();
};
$('#csv').onclick = () => {
  const byId = Object.fromEntries(lectures.map(l => [l.id, l]));
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [['특강','강사','이름','연락처','등록상태','출신지구','신청시각'].map(q).join(',')];
  enrolls.forEach(e => { const l = byId[e.lecture_id] || {};
    lines.push([l.title, l.speaker_name, e.student_name, e.student_phone, e.reg_status, e.district, new Date(e.created_at).toLocaleString('ko-KR')].map(q).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '선택특강_신청현황.csv'; a.click();
};

// ---------- 설정 ----------
const toLocal = iso => { if (!iso) return ''; const d = new Date(iso), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
async function loadSettings(){
  const { data, error } = await sb.from('settings').select('*').eq('id', 1).single();
  if (error) return;
  ['event_title','notice','access_code'].forEach(f => $('#s_' + f).value = data[f] ?? '');
  $('#s_open_at').value = toLocal(data.open_at); $('#s_close_at').value = toLocal(data.close_at);
}
$('#saveSet').onclick = async () => {
  const o = $('#s_open_at').value, c = $('#s_close_at').value;
  const row = {
    event_title: $('#s_event_title').value.trim() || '수련회 선택특강',
    notice: $('#s_notice').value.trim(),
    access_code: $('#s_access_code').value.trim(),
    open_at: o ? new Date(o).toISOString() : null,
    close_at: c ? new Date(c).toISOString() : null
  };
  if (row.open_at && row.close_at && row.close_at <= row.open_at) { toast('마감 시각이 시작보다 늦어야 해요.'); return; }
  const { error } = await sb.from('settings').update(row).eq('id', 1);
  toast(error ? '저장 실패: ' + error.message : '저장했어요.');
};

boot();
</script>
</body>
</html>
