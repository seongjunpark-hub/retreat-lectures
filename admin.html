<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>특강 관리자</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <div><p class="eyebrow">관리자</p><h1>선택특강 관리</h1></div>
  <div class="who hidden" id="who"><span id="whoEmail"></span><br><button id="logout">로그아웃</button></div>
</div></header>

<!-- 로그인 -->
<main id="loginBox" class="wrap hidden">
  <div class="narrow">
    <div class="card">
      <h2>관리자 로그인</h2>
      <p class="hint" style="margin:-6px 0 18px">Supabase에 등록한 관리자 이메일과 비밀번호로 로그인하세요.</p>
      <div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="username"></div>
      <div class="field"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div>
      <button class="big" id="loginBtn">로그인</button>
    </div>
    <a class="foot-link" href="./">← 학생 신청 화면으로</a>
  </div>
</main>

<main id="app" class="wrap hidden">
  <div class="tabs">
    <button data-tab="lectures" class="on">특강 관리</button>
    <button data-tab="enrolls">신청 현황</button>
    <button data-tab="settings">신청 설정</button>
  </div>

  <!-- 특강 관리 -->
  <section data-pane="lectures">
    <div class="toolbar">
      <span class="sum" id="lecSum"></span>
      <button id="newLec">＋ 새 특강 등록</button>
    </div>
    <div class="lec-grid" id="lecList"></div>
  </section>

  <!-- 신청 현황 -->
  <section data-pane="enrolls" class="hidden">
    <div class="card">
      <div class="stat" id="stats"></div>
      <div id="breakdown" class="table-scroll" style="margin-top:16px"></div>
      <div class="actions"><button id="refreshEn" class="ghost">새로고침</button><button id="csv">CSV 다운로드</button></div>
    </div>
    <div id="enList"></div>
  </section>

  <!-- 설정 -->
  <section data-pane="settings" class="hidden">
    <div class="card">
      <div class="grid">
        <div class="full"><label>행사 이름</label><input id="s_event_title"></div>
        <div class="full"><label>안내 문구 (학생 화면 상단)</label><textarea id="s_notice"></textarea></div>
        <div><label>신청 시작</label><input id="s_open_at" type="datetime-local"></div>
        <div><label>신청 마감 (비우면 계속 열림)</label><input id="s_close_at" type="datetime-local"></div>
        <div class="full"><label>입장 코드 (비우면 사용 안 함)</label><input id="s_access_code" placeholder="예: 은혜2026"></div>
      </div>
      <p class="hint">입장 코드는 현장에서만 알려 주면 외부인이 자리를 채우는 걸 막을 수 있어요.</p>
      <div class="actions"><button id="saveSet">저장</button></div>
    </div>
    <a class="foot-link" href="./" target="_blank">학생 화면 새 창으로 보기 ↗</a>
  </section>
</main>

<!-- 특강 등록/수정 창 -->
<div class="modal hidden" id="lecModal">
  <div class="card">
    <div class="head"><h2 id="formTitle">새 특강 등록</h2><button class="ghost small" id="closeModal">닫기</button></div>
    <div class="grid">
      <div class="full"><label>특강 제목 *</label><input id="f_title"></div>
      <div class="full"><label>특강 내용</label><textarea id="f_description" placeholder="학생들이 보고 고를 수 있게 2~3줄로 소개해 주세요"></textarea></div>
      <div><label>강사 이름 *</label><input id="f_speaker_name"></div>
      <div><label>강사 연락처 (학생에게 비공개)</label><input id="f_speaker_contact" inputmode="tel"></div>
      <div class="full"><label>강사 약력</label><textarea id="f_speaker_bio"></textarea></div>
      <div><label>장소</label><input id="f_location" placeholder="예: 본관 201호"></div>
      <div><label>정원 (명) *</label><input id="f_capacity" type="number" min="1" inputmode="numeric"></div>
      <div><label>표시 순서 (작을수록 앞)</label><input id="f_sort_order" type="number"></div>
    </div>
    <div class="actions"><button id="saveLec">등록</button><button class="ghost" id="cancelEdit">취소</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000); }
let lectures = [], enrolls = [], editingId = null;

// ---------- 로그인 ----------
function showLogin(){ $('#loginBox').classList.remove('hidden'); $('#app').classList.add('hidden'); $('#who').classList.add('hidden'); }
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showLogin(); return; }
  const { data: ok } = await sb.rpc('is_admin');
  if (!ok) { toast('관리자로 등록되지 않은 계정이에요.'); await sb.auth.signOut(); showLogin(); return; }
  $('#loginBox').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#who').classList.remove('hidden');
  $('#whoEmail').textContent = session.user.email;
  await loadLectures();
  await Promise.all([loadSettings(), loadEnrolls()]);
}
$('#loginBtn').onclick = async () => {
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = '로그인 중…';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pw').value });
  btn.disabled = false; btn.textContent = '로그인';
  if (error) { toast('로그인 실패: 이메일/비밀번호를 확인하세요.'); return; }
  boot();
};
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });
$('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// ---------- 탭 ----------
$$('.tabs button[data-tab]').forEach(b => b.onclick = () => {
  $$('.tabs button[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  $$('[data-pane]').forEach(p => p.classList.toggle('hidden', p.dataset.pane !== b.dataset.tab));
  if (b.dataset.tab === 'enrolls') loadEnrolls();
});

// ---------- 특강 ----------
const LF = ['title','description','speaker_name','speaker_contact','speaker_bio','location','capacity','sort_order'];
async function loadLectures(){
  const { data, error } = await sb.from('lectures').select('*').order('sort_order').order('created_at');
  if (error) { toast('특강을 불러오지 못했어요.'); return; }
  lectures = data; renderLectures();
}
const countFor = id => enrolls.filter(e => e.lecture_id === id).length;
function renderLectures(){
  const cap = lectures.reduce((a, l) => a + l.capacity, 0);
  $('#lecSum').innerHTML = `특강 <b>${lectures.length}</b>개 · 전체 정원 <b>${cap}</b>명 · 신청 <b>${enrolls.length}</b>명`;
  $('#lecList').innerHTML = lectures.length ? lectures.map((l, i) => {
    const n = countFor(l.id), full = n >= l.capacity, pct = Math.min(100, Math.round(n / l.capacity * 100));
    return `<article class="lec${full ? ' is-full' : ''}" style="opacity:1">
      <p class="num">특강 ${i + 1}</p>
      <h3>${esc(l.title)}</h3>
      <p class="speaker">강사 <b>${esc(l.speaker_name)}</b></p>
      ${l.speaker_contact ? `<p class="contact">☎ ${esc(l.speaker_contact)}</p>` : ''}
      ${l.location ? `<p class="loc">📍 ${esc(l.location)}</p>` : ''}
      ${l.description ? `<p class="desc">${esc(l.description)}</p>` : ''}
      ${l.speaker_bio ? `<details><summary>강사 약력</summary><p>${esc(l.speaker_bio)}</p></details>` : ''}
      <div class="bottom">
        <div class="seats"><span class="left">${full ? '마감' : '남은 자리 ' + (l.capacity - n)}</span><span>${n} / ${l.capacity}명</span></div>
        <div class="meter"><div style="width:${pct}%"></div></div>
        <div class="admin-actions"><button class="ghost" data-edit="${l.id}">수정</button><button class="danger" data-del="${l.id}">삭제</button></div>
      </div>
    </article>`;
  }).join('') : `<div class="card empty" style="grid-column:1/-1">아직 등록된 특강이 없어요.<br><br><button onclick="openForm()">＋ 첫 특강 등록하기</button></div>`;
}
function openForm(l){
  editingId = l ? l.id : null;
  LF.forEach(f => $('#f_' + f).value = l ? (l[f] ?? '') : (f === 'capacity' ? '15' : f === 'sort_order' ? String(lectures.length + 1) : ''));
  $('#formTitle').textContent = l ? '특강 수정' : '새 특강 등록';
  $('#saveLec').textContent = l ? '수정 저장' : '등록';
  $('#lecModal').classList.remove('hidden'); $('#f_title').focus();
}
function closeForm(){ $('#lecModal').classList.add('hidden'); editingId = null; }
$('#newLec').onclick = () => openForm();
$('#closeModal').onclick = closeForm; $('#cancelEdit').onclick = closeForm;
$('#lecModal').onclick = e => { if (e.target.id === 'lecModal') closeForm(); };
$('#saveLec').onclick = async () => {
  const row = {};
  LF.forEach(f => row[f] = $('#f_' + f).value.trim());
  row.capacity = parseInt(row.capacity, 10); row.sort_order = parseInt(row.sort_order, 10) || 0;
  if (!row.title || !row.speaker_name || !(row.capacity > 0)) { toast('제목, 강사 이름, 정원은 꼭 입력해 주세요.'); return; }
  const q = editingId ? sb.from('lectures').update(row).eq('id', editingId) : sb.from('lectures').insert(row);
  const { error } = await q;
  if (error) { toast('저장 실패: ' + error.message); return; }
  toast(editingId ? '수정했어요.' : '등록했어요.'); closeForm(); loadLectures();
};
$('#lecList').onclick = async e => {
  const ed = e.target.closest('[data-edit]')?.dataset.edit, del = e.target.closest('[data-del]')?.dataset.del;
  if (ed) openForm(lectures.find(x => x.id === ed));
  if (del) {
    const n = countFor(del), l = lectures.find(x => x.id === del);
    if (!confirm(n ? `「${l.title}」 신청자 ${n}명의 신청 내역도 함께 삭제돼요. 삭제할까요?` : `「${l.title}」 특강을 삭제할까요?`)) return;
    const { error } = await sb.from('lectures').delete().eq('id', del);
    if (error) toast('삭제 실패: ' + error.message); else { toast('삭제했어요.'); await loadEnrolls(); loadLectures(); }
  }
};

// ---------- 신청 현황 ----------
async function loadEnrolls(){
  const { data, error } = await sb.from('enrollments').select('*').order('created_at');
  if (error) { toast('신청 현황을 불러오지 못했어요.'); return; }
  enrolls = data; renderEnrolls(); renderLectures();
}
function renderEnrolls(){
  const cap = lectures.reduce((a, l) => a + l.capacity, 0);
  $('#stats').innerHTML = `<div><b>${enrolls.length}</b><span>신청한 학생 수</span></div><div><b>${cap - enrolls.length}</b><span>남은 자리</span></div><div><b>${cap}</b><span>전체 정원</span></div>`;
  const ORDER = ['안동','영주','경주','김천구미','포항'];
  const dKey = d => ORDER.includes(d) ? d : (d ? '그외' : '미입력');
  const tbl = {};
  enrolls.forEach(e => { const k = dKey(e.district); tbl[k] ??= { 가등록: 0, 등록: 0, etc: new Set() };
    if (e.reg_status === '등록') tbl[k].등록++; else tbl[k].가등록++;
    if (k === '그외') tbl[k].etc.add(e.district.replace(/^그외\(|\)$/g, '')); });
  const keys = [...ORDER, '그외', '미입력'].filter(k => tbl[k]);
  const tot = { 가등록: 0, 등록: 0 }; keys.forEach(k => { tot.가등록 += tbl[k].가등록; tot.등록 += tbl[k].등록; });
  $('#breakdown').innerHTML = keys.length ? `<table><tr><th>출신 지구</th><th>가등록</th><th>등록</th><th>합계</th></tr>
    ${keys.map(k => `<tr><td>${esc(k)}${k === '그외' && tbl[k].etc.size ? `<br><small style="color:var(--muted)">${esc([...tbl[k].etc].join(', '))}</small>` : ''}</td>
      <td>${tbl[k].가등록}</td><td>${tbl[k].등록}</td><td><b>${tbl[k].가등록 + tbl[k].등록}</b></td></tr>`).join('')}
    <tr><td><b>합계</b></td><td><b>${tot.가등록}</b></td><td><b>${tot.등록}</b></td><td><b>${tot.가등록 + tot.등록}</b></td></tr></table>` : '';
  const phone = p => p.length === 11 ? p.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3') : p;
  const time = iso => new Date(iso).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  $('#enList').innerHTML = lectures.map((l, i) => {
    const rows = enrolls.filter(e => e.lecture_id === l.id);
    return `<div class="card"><p class="num" style="margin:0;font-size:13px;font-weight:700;color:var(--accent)">특강 ${i + 1}</p>
      <h3>${esc(l.title)}</h3><p class="hint" style="margin:4px 0 0">${esc(l.speaker_name)} · <b>${rows.length}</b>/${l.capacity}명</p>
      ${rows.length ? `<div class="table-scroll"><table style="margin-top:10px"><tr><th>#</th><th>이름</th><th>연락처</th><th>등록</th><th>지구</th><th>신청시각</th><th></th></tr>
      ${rows.map((r, j) => `<tr><td>${j + 1}</td><td>${esc(r.student_name)}</td><td>${esc(phone(r.student_phone))}</td><td>${esc(r.reg_status)}</td><td>${esc(r.district)}</td><td>${time(r.created_at)}</td>
        <td><button class="danger small" data-rm="${r.id}">삭제</button></td></tr>`).join('')}</table></div>`
      : '<p class="empty" style="padding:12px 0 0">아직 신청자가 없어요.</p>'}</div>`;
  }).join('');
}
$('#refreshEn').onclick = loadEnrolls;
$('#enList').onclick = async e => {
  const id = e.target.closest('[data-rm]')?.dataset.rm;
  if (!id || !confirm('이 신청을 삭제할까요?')) return;
  const { error } = await sb.from('enrollments').delete().eq('id', id);
  if (error) toast('삭제 실패'); else loadEnrolls();
};
$('#csv').onclick = () => {
  const byId = Object.fromEntries(lectures.map(l => [l.id, l]));
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [['특강','강사','장소','이름','연락처','등록상태','출신지구','신청시각'].map(q).join(',')];
  enrolls.forEach(e => { const l = byId[e.lecture_id] || {};
    lines.push([l.title, l.speaker_name, l.location, e.student_name, e.student_phone, e.reg_status, e.district, new Date(e.created_at).toLocaleString('ko-KR')].map(q).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '선택특강_신청현황.csv'; a.click();
};

// ---------- 설정 ----------
const toLocal = iso => { if (!iso) return ''; const d = new Date(iso), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
async function loadSettings(){
  const { data, error } = await sb.from('settings').select('*').eq('id', 1).single();
  if (error) return;
  ['event_title','notice','access_code'].forEach(f => $('#s_' + f).value = data[f] ?? '');
  $('#s_open_at').value = toLocal(data.open_at); $('#s_close_at').value = toLocal(data.close_at);
}
$('#saveSet').onclick = async () => {
  const o = $('#s_open_at').value, c = $('#s_close_at').value;
  const row = {
    event_title: $('#s_event_title').value.trim() || '수련회 선택특강',
    notice: $('#s_notice').value.trim(),
    access_code: $('#s_access_code').value.trim(),
    open_at: o ? new Date(o).toISOString() : null,
    close_at: c ? new Date(c).toISOString() : null
  };
  if (row.open_at && row.close_at && row.close_at <= row.open_at) { toast('마감 시각이 시작보다 늦어야 해요.'); return; }
  const { error } = await sb.from('settings').update(row).eq('id', 1);
  toast(error ? '저장 실패: ' + error.message : '저장했어요.');
};

boot();
</script>
</body>
</html>
