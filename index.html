<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선택특강 수강신청</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <div>
    <p class="eyebrow">선택특강 수강신청</p>
    <h1 id="eventTitle">불러오는 중…</h1>
    <p id="notice" class="notice"></p>
  </div>
  <div class="who hidden" id="who">
    <b id="whoName"></b> 님<br><span id="whoMeta"></span><br>
    <span class="who-btns"><button id="editInfo">정보 변경</button> <button id="logoutBtn">로그아웃</button></span>
  </div>
</div></header>

<!-- ① 입장 / 내 정보 화면 -->
<main id="entry" class="wrap hidden">
  <div class="narrow">
    <div class="seg" id="modeSeg" style="margin:0 0 14px">
      <button type="button" data-m="new">처음이에요</button>
      <button type="button" data-m="login">이미 등록했어요</button>
    </div>

    <!-- 로그인 -->
    <div class="card hidden" id="loginCard">
      <h2>로그인</h2>
      <p class="hint" style="margin:-6px 0 18px">처음 등록할 때 쓴 이름과 휴대폰 번호를 입력해 주세요.</p>
      <div class="field"><label for="lName">이름</label><input id="lName" autocomplete="name" maxlength="30"></div>
      <div class="field"><label for="lPhone">휴대폰 번호</label><input id="lPhone" inputmode="numeric" autocomplete="tel" placeholder="010-1234-5678" maxlength="13"></div>
      <div class="field hidden code-field"><label for="lCode">입장 코드</label><input id="lCode" maxlength="20" inputmode="numeric" placeholder="안내받은 코드"></div>
      <button class="big" id="loginBtn">로그인</button>
    </div>

    <!-- 등록 / 정보 변경 -->
    <div class="card hidden" id="regCard">
      <h2 id="entryTitle">정보 등록</h2>
      <p class="hint" id="entryHint" style="margin:-6px 0 18px">처음 한 번만 등록하면, 다음부터는 이름과 번호로 로그인할 수 있어요.</p>
      <div class="field"><label for="name">이름</label><input id="name" autocomplete="name" maxlength="30"></div>
      <div class="field"><label for="phone">휴대폰 번호</label><input id="phone" inputmode="numeric" autocomplete="tel" placeholder="010-1234-5678" maxlength="13"></div>
      <div class="field" id="phone2Wrap"><label for="phone2">휴대폰 번호 확인</label><input id="phone2" inputmode="numeric" autocomplete="off" placeholder="한 번 더 입력" maxlength="13">
        <p class="hint" id="phoneMsg"></p></div>
      <p class="hint hidden" id="lockHint" style="margin:-8px 0 16px">이름·번호는 바꿀 수 없어요. 잘못 등록했다면 담당 간사에게 알려 주세요.</p>

      <div class="field" id="regWrap"><label>수련회 등록 상태</label>
        <div class="seg" id="regSeg"><button type="button" data-v="가등록">가등록</button><button type="button" data-v="등록">완등록</button></div>
      </div>
      <div class="field"><label for="district">지구</label>
        <select id="district">
          <option value="">선택하세요</option>
          <option>안동</option><option>영주</option><option>경주</option>
          <option>김천구미</option><option>포항</option><option value="그외">그 외</option>
        </select>
      </div>
      <div class="field hidden" id="campusWrap"><label for="campus">캠퍼스</label>
        <select id="campus"></select>
        <input id="campusEtc" class="hidden" maxlength="30" placeholder="캠퍼스(학교) 이름" style="margin-top:8px">
      </div>
      <div class="hidden" id="etcWrap">
        <div class="field"><label for="follow">어느 지구와 함께 참여하나요?</label>
          <select id="follow"><option value="">선택하세요</option><option>안동</option><option>영주</option><option>경주</option><option>김천구미</option><option>포항</option></select></div>
        <div class="field"><label for="church">출석 교회</label><input id="church" maxlength="30" placeholder="예: ○○교회"></div>
      </div>
      <div class="field"><label for="grade">학년</label>
        <select id="grade"><option value="">선택하세요</option><option>1학년</option><option>2학년</option><option>3학년</option><option>4학년</option><option>5학년 이상</option><option>휴학생</option><option>졸업생</option></select></div>
      <div class="field"><label>순장 / 순원</label>
        <div class="seg" id="soonSeg"><button type="button" data-v="순장">순장</button><button type="button" data-v="순원">순원</button><button type="button" data-v="해당 없음">해당 없음</button></div>
      </div>
      <div class="field hidden code-field" id="codeWrap"><label for="code">입장 코드</label><input id="code" maxlength="20" inputmode="numeric" placeholder="안내받은 코드"></div>
      <button class="big" id="enterBtn">등록하고 입장하기</button>
      <button class="big ghost hidden" id="cancelEditBtn" style="margin-top:8px">취소</button>
    </div>
    <a class="foot-link" href="admin.html">간사·관리자 로그인 →</a>
  </div>
</main>

<!-- ② 특강 목록 화면 -->
<main id="board" class="wrap hidden">
  <section class="status" id="statusBox">
    <div><p class="label" id="statusLabel"></p><p class="big" id="statusBig">&nbsp;</p></div>
    <p class="sub" id="statusSub"></p>
  </section>

  <section class="card mine none" id="mineBox"></section>

  <div class="list-head"><h2>특강 목록</h2><span id="listInfo"></span></div>
  <div class="lec-grid" id="lectures"></div>
  <a class="foot-link" href="admin.html">간사·관리자 로그인 →</a>
</main>
<div id="toast"></div>

<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state = null, offset = 0, lastPhase = null, mine = [], pending = null, profile = null;

let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); }

// ---------- 내 정보 (서버 명단 + 이 기기에 로그인 유지) ----------
const KEY = 'rl_student_v4';
const DISTRICTS = ['안동','영주','경주','김천구미','포항'];
function loadProfile(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
function saveProfile(p){ try { p ? localStorage.setItem(KEY, JSON.stringify(p)) : localStorage.removeItem(KEY); } catch (e) {} }
let reg = '', soon = '', editMode = false, mode = 'new';
const fmtPhone = v => { const d = v.replace(/\D/g, '').slice(0, 11); return d.length < 4 ? d : d.length < 8 ? d.slice(0,3) + '-' + d.slice(3) : d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7); };
const phoneOk = d => /^010\d{8}$/.test(d);
const REGLABEL = r => r === '등록' ? '완등록' : (r || '');
function syncSeg(){
  $$('#regSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === reg));
  $$('#soonSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === soon));
  $$('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
}
$('#regSeg').onclick = e => { const b = e.target.closest('button'); if (b) { reg = b.dataset.v; syncSeg(); } };
$('#soonSeg').onclick = e => { const b = e.target.closest('button'); if (b) { soon = b.dataset.v; syncSeg(); } };
$('#modeSeg').onclick = e => { const b = e.target.closest('button'); if (b) showEntry(b.dataset.m); };

function checkPhones(){
  const a = $('#phone').value.replace(/\D/g, ''), b = $('#phone2').value.replace(/\D/g, ''), msg = $('#phoneMsg');
  if (!a) { msg.textContent = ''; return; }
  if (!phoneOk(a)) { msg.textContent = '010으로 시작하는 11자리 번호를 입력해 주세요.'; msg.style.color = 'var(--warn)'; return; }
  if (!b) { msg.textContent = ''; return; }
  if (a !== b) { msg.textContent = '두 번호가 달라요. 다시 확인해 주세요.'; msg.style.color = 'var(--warn)'; return; }
  msg.textContent = '✓ 번호가 일치해요'; msg.style.color = 'var(--ok)';
}
['phone','phone2','lPhone'].forEach(id => $('#' + id).addEventListener('input', e => { e.target.value = fmtPhone(e.target.value); if (id !== 'lPhone') checkPhones(); }));

function campusOptions(d){
  const list = (state?.settings.campuses || {})[d] || [];
  const sel = $('#campus');
  if (!list.length) { sel.classList.add('hidden'); $('#campusEtc').classList.remove('hidden'); return; }
  sel.classList.remove('hidden');
  sel.innerHTML = '<option value="">선택하세요</option>' + list.map(c => `<option>${esc(c)}</option>`).join('') + '<option value="__etc">기타 (직접 입력)</option>';
  $('#campusEtc').classList.toggle('hidden', sel.value !== '__etc');
}
function syncDistrict(){
  const d = $('#district').value;
  $('#campusWrap').classList.toggle('hidden', !DISTRICTS.includes(d));
  $('#etcWrap').classList.toggle('hidden', d !== '그외');
  if (DISTRICTS.includes(d)) campusOptions(d);
}
$('#district').onchange = syncDistrict;
$('#campus').onchange = () => { const etc = $('#campus').value === '__etc'; $('#campusEtc').classList.toggle('hidden', !etc); if (etc) $('#campusEtc').focus(); };

function fillForm(p){
  p = p || {};
  $('#name').value = p.name || ''; $('#phone').value = fmtPhone(p.phone || ''); $('#phone2').value = fmtPhone(p.phone || '');
  reg = p.reg || ''; soon = p.soon || ''; syncSeg();
  $('#district').value = p.district || ''; syncDistrict();
  $('#campusEtc').value = '';
  if (p.campus) {
    const opts = [...$('#campus').options].map(o => o.value);
    if (!$('#campus').classList.contains('hidden') && opts.includes(p.campus)) $('#campus').value = p.campus;
    else { if (!$('#campus').classList.contains('hidden')) $('#campus').value = '__etc'; $('#campusEtc').value = p.campus; $('#campusEtc').classList.remove('hidden'); }
  }
  $('#follow').value = p.follow || ''; $('#church').value = p.church || '';
  $('#grade').value = p.grade || ''; $('#code').value = p.code || '';
  checkPhones();
}
function readForm(){
  const d = $('#district').value;
  let campus = '';
  if (DISTRICTS.includes(d)) campus = $('#campus').classList.contains('hidden') || $('#campus').value === '__etc' ? $('#campusEtc').value.trim() : $('#campus').value;
  return {
    name: $('#name').value.trim(), phone: $('#phone').value.replace(/\D/g, ''), phone2: $('#phone2').value.replace(/\D/g, ''),
    reg, soon, district: d, campus, grade: $('#grade').value,
    follow: d === '그외' ? $('#follow').value : '', church: d === '그외' ? $('#church').value.trim() : '',
    code: $('#code').value.trim()
  };
}
function problem(f, isNew){
  if (!f.name) return ['이름을 입력해 주세요.', '#name'];
  if (!phoneOk(f.phone)) return ['휴대폰 번호를 010으로 시작하는 11자리로 입력해 주세요.', '#phone'];
  if (isNew && f.phone !== f.phone2) return ['휴대폰 번호 확인이 맞지 않아요.', '#phone2'];
  if (isNew && !f.reg) return ['가등록/완등록 중 하나를 선택해 주세요.'];
  if (!f.district) return ['지구를 선택해 주세요.', '#district'];
  if (DISTRICTS.includes(f.district) && !f.campus) return ['캠퍼스를 선택해 주세요.', '#campus'];
  if (f.district === '그외' && !f.follow) return ['함께 참여하는 지구를 선택해 주세요.', '#follow'];
  if (f.district === '그외' && !f.church) return ['출석 교회를 입력해 주세요.', '#church'];
  if (!f.grade) return ['학년을 선택해 주세요.', '#grade'];
  if (!f.soon) return ['순장/순원 여부를 선택해 주세요.'];
  if (isNew && state?.settings.needs_code && !f.code) return ['입장 코드를 입력해 주세요.', '#code'];
  return null;
}
function serverMsg(error, data){
  const m = error?.message || data?.message || '';
  if (/function|schema cache|Could not find/i.test(m)) return '서버 설정이 최신이 아니에요. 담당 간사에게 알려 주세요.';
  return m || '잠시 후 다시 시도해 주세요.';
}

// 등록 / 정보 변경 저장
$('#enterBtn').onclick = async () => {
  const f = readForm(), isNew = !editMode;
  if (editMode) { f.name = profile.name; f.phone = profile.phone; f.code = profile.code; }
  const pr = problem(f, isNew);
  if (pr) { toast(pr[0]); if (pr[1]) $(pr[1]).focus(); return; }
  const btn = $('#enterBtn'), label = btn.textContent; btn.disabled = true; btn.textContent = '저장 중…';
  const { data, error } = await sb.rpc('save_student', { p_name: f.name, p_phone: f.phone, p_reg_status: f.reg, p_district: f.district,
    p_campus: f.campus, p_grade: f.grade, p_soon_role: f.soon, p_follow_district: f.follow, p_church: f.church, p_code: f.code, p_is_new: isNew });
  btn.disabled = false; btn.textContent = label;
  if (error || !data?.ok) {
    toast(serverMsg(error, data));
    if (data?.code === 'exists') { $('#lName').value = f.name; $('#lPhone').value = fmtPhone(f.phone); $('#lCode').value = f.code; showEntry('login'); }
    return;
  }
  profile = { ...data.student, code: f.code }; saveProfile(profile);
  toast(isNew ? '등록했어요! 이제 특강을 신청할 수 있어요.' : '내 정보를 저장했어요.');
  showBoard();
};

// 로그인
$('#loginBtn').onclick = async () => {
  const name = $('#lName').value.trim(), phone = $('#lPhone').value.replace(/\D/g, ''), code = $('#lCode').value.trim();
  if (!name) { toast('이름을 입력해 주세요.'); $('#lName').focus(); return; }
  if (!phoneOk(phone)) { toast('휴대폰 번호를 010으로 시작하는 11자리로 입력해 주세요.'); $('#lPhone').focus(); return; }
  if (state?.settings.needs_code && !code) { toast('입장 코드를 입력해 주세요.'); $('#lCode').focus(); return; }
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = '확인 중…';
  const { data, error } = await sb.rpc('student_login', { p_name: name, p_phone: phone, p_code: code });
  btn.disabled = false; btn.textContent = '로그인';
  if (error || !data?.ok) { toast(serverMsg(error, data)); return; }
  profile = { ...data.student, code }; saveProfile(profile);
  showBoard();
};
$('#lPhone').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });

$('#editInfo').onclick = () => { fillForm(profile); showEntry('edit'); };
$('#cancelEditBtn').onclick = () => showBoard();
$('#logoutBtn').onclick = () => {
  if (!confirm('로그아웃할까요? 신청 내역은 그대로 남아 있고, 이름과 번호로 다시 로그인할 수 있어요.')) return;
  profile = null; mine = []; saveProfile(null);
  $('#lName').value = ''; $('#lPhone').value = ''; $('#lCode').value = ''; fillForm({});
  showEntry('login');
};

function showEntry(m){
  mode = m === 'edit' ? mode : m; editMode = m === 'edit';
  syncSeg();
  $('#modeSeg').classList.toggle('hidden', editMode);
  $('#loginCard').classList.toggle('hidden', m !== 'login');
  $('#regCard').classList.toggle('hidden', m === 'login');
  $('#entryTitle').textContent = editMode ? '내 정보 변경' : '정보 등록';
  $('#entryHint').textContent = editMode ? '바꿀 내용을 고친 뒤 저장해 주세요.' : '처음 한 번만 등록하면, 다음부터는 이름과 번호로 로그인할 수 있어요.';
  $('#enterBtn').textContent = editMode ? '저장하고 돌아가기' : '등록하고 입장하기';
  $('#cancelEditBtn').classList.toggle('hidden', !editMode);
  $('#name').readOnly = $('#phone').readOnly = editMode;
  $('#phone2Wrap').classList.toggle('hidden', editMode);
  $('#lockHint').classList.toggle('hidden', !editMode);
  $('#regWrap').classList.toggle('hidden', editMode);
  $$('.code-field').forEach(x => x.classList.toggle('hidden', !state?.settings.needs_code || editMode));
  $('#entry').classList.remove('hidden'); $('#board').classList.add('hidden'); $('#who').classList.add('hidden');
  window.scrollTo(0, 0);
}
function showBoard(){
  editMode = false;
  $('#entry').classList.add('hidden'); $('#board').classList.remove('hidden'); $('#who').classList.remove('hidden');
  $('#whoName').textContent = profile.name;
  const where = profile.district === '그외' ? `${profile.church} (${profile.follow}지구와 함께)` : `${profile.district} · ${profile.campus}`;
  $('#whoMeta').textContent = `${where} · ${profile.grade} · ${REGLABEL(profile.reg)}`;
  window.scrollTo(0, 0);
  loadMine();
  if (state) renderBoard();
}

// ---------- 서버 시간 / 상태 ----------
const serverNow = () => Date.now() + offset;
function phase(){
  if (!state) return 'loading';
  const s = state.settings, n = serverNow();
  if (!s.open_at) return 'unset';
  if (n < new Date(s.open_at).getTime()) return 'before';
  if (s.close_at && n > new Date(s.close_at).getTime()) return 'closed';
  return 'open';
}
const fmt = iso => new Date(iso).toLocaleString('ko-KR', {month:'long', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit'});
function hms(ms){
  const t = Math.max(0, Math.ceil(ms / 1000));
  const d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  const p = n => String(n).padStart(2, '0');
  return (d ? d + '일 ' : '') + `${p(h)}:${p(m)}:${p(s)}`;
}

async function load(){
  const t0 = Date.now();
  const { data, error } = await sb.rpc('get_state');
  if (error) { $('#eventTitle').textContent = '서버 연결에 실패했어요'; toast('잠시 후 새로고침해 주세요.'); return; }
  const rtt = Date.now() - t0;
  offset = new Date(data.now).getTime() - (Date.now() - rtt / 2);
  const first = !state; state = data;
  const s = state.settings;
  $('#eventTitle').textContent = s.event_title; document.title = s.event_title + ' 수강신청';
  $('#notice').textContent = s.notice || '';
  if (first) {
    const saved = loadProfile();
    if (saved?.name && saved?.phone) {
      const { data } = await sb.rpc('student_login', { p_name: saved.name, p_phone: saved.phone, p_code: saved.code || '' });
      if (data?.ok) { profile = { ...data.student, code: saved.code || '' }; saveProfile(profile); showBoard(); }
      else { $('#lName').value = saved.name; $('#lPhone').value = fmtPhone(saved.phone); showEntry('login'); if (data?.message) toast(data.message); }
    } else showEntry('new');
  }
  lastPhase = phase();
  renderBoard();
}

function renderStatus(){
  const p = phase(), s = state?.settings, box = $('#statusBox');
  if (!s) return;
  box.className = 'status' + (p === 'open' ? ' open' : p === 'closed' ? ' closed' : '');
  if (p === 'before') {
    $('#statusLabel').textContent = '신청 시작까지';
    $('#statusBig').textContent = hms(new Date(s.open_at).getTime() - serverNow());
    $('#statusSub').textContent = fmt(s.open_at) + ' 오픈 · 선착순';
  } else if (p === 'open') {
    $('#statusLabel').textContent = '지금 신청할 수 있어요';
    $('#statusBig').textContent = '선착순 신청 중';
    $('#statusSub').textContent = s.close_at ? fmt(s.close_at) + ' 마감' : '';
  } else if (p === 'closed') {
    $('#statusLabel').textContent = '';
    $('#statusBig').textContent = '신청 마감';
    $('#statusSub').textContent = '변경이 필요하면 담당 간사에게 문의하세요.';
  } else {
    $('#statusLabel').textContent = '';
    $('#statusBig').textContent = '오픈 시간 미정';
    $('#statusSub').textContent = '특강 목록은 미리 둘러볼 수 있어요.';
  }
  if (p !== lastPhase) { lastPhase = p; load(); }
}

function renderMine(){
  const box = $('#mineBox'), m = mine[0];
  if (!m) {
    box.className = 'card mine none';
    box.innerHTML = `<div><p class="tag">내 신청</p><p class="title" style="font-size:16px;font-weight:600">아직 신청한 특강이 없어요</p>
      <p class="meta">특강은 1인 1개만 신청할 수 있어요.</p></div>`;
    return;
  }
  box.className = 'card mine';
  box.innerHTML = `<div><p class="tag">✓ 내가 신청한 특강</p><p class="title">${esc(m.title)}</p>
    <p class="meta">${esc(m.speaker_name)}${m.location ? ' · ' + esc(m.location) : ''}</p></div>
    <button class="danger" id="cancelBtn">신청 취소</button>`;
  $('#cancelBtn').onclick = cancelMine;
}

function renderLectures(){
  const p = phase(), list = state.lectures, myId = mine[0]?.lecture_id;
  const left = list.reduce((a, l) => a + Math.max(0, l.capacity - l.enrolled), 0);
  $('#listInfo').textContent = list.length ? `${list.length}개 · 남은 자리 ${left}` : '';
  if (!list.length) { $('#lectures').innerHTML = '<div class="card empty" style="grid-column:1/-1">아직 등록된 특강이 없어요.</div>'; return; }
  $('#lectures').innerHTML = list.map((l, i) => {
    const full = l.enrolled >= l.capacity, isMine = l.id === myId, remain = Math.max(0, l.capacity - l.enrolled);
    const pct = Math.min(100, Math.round(l.enrolled / l.capacity * 100));
    let label = '이 특강 신청하기', dis = false, cls = '';
    if (isMine) { label = '✓ 신청 완료'; dis = true; cls = 'done'; }
    else if (pending === l.id) { label = '신청 중…'; dis = true; }
    else if (myId) { label = '다른 특강 신청함'; dis = true; }
    else if (p === 'before' || p === 'unset') { label = '오픈 전'; dis = true; }
    else if (p === 'closed') { label = '신청 마감'; dis = true; }
    else if (full) { label = '정원 마감'; dis = true; }
    return `<article class="lec${isMine ? ' is-mine' : ''}${full && !isMine ? ' is-full' : ''}">
      <p class="num">특강 ${i + 1}</p>
      <h3>${esc(l.title)}</h3>
      <p class="speaker">강사 <b>${esc(l.speaker_name)}</b></p>
      ${l.location ? `<p class="loc">📍 ${esc(l.location)}</p>` : ''}
      ${l.description ? `<p class="desc">${esc(l.description)}</p>` : ''}
      ${l.speaker_bio ? `<details><summary>강사 약력 보기</summary><p>${esc(l.speaker_bio)}</p></details>` : ''}
      <div class="bottom">
        <div class="seats"><span class="left">${full ? '마감' : '남은 자리 ' + remain}</span><span>${l.enrolled} / ${l.capacity}명</span></div>
        <div class="meter"><div style="width:${pct}%"></div></div>
        <button class="${cls}" data-id="${l.id}" ${dis ? 'disabled' : ''}>${label}</button>
      </div>
    </article>`;
  }).join('');
}
function renderBoard(){ if (!state || !profile) return; renderStatus(); renderMine(); renderLectures(); }

// ---------- 신청 / 조회 / 취소 ----------
$('#lectures').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-id]');
  if (!btn || btn.disabled || pending) return;
  const l = state.lectures.find(x => x.id === btn.dataset.id);
  pending = l.id; renderLectures();
  const { data, error } = await sb.rpc('enroll', { p_lecture_id: l.id, p_name: profile.name, p_phone: profile.phone, p_code: profile.code || '' });
  pending = null;
  if (error) toast('네트워크 오류예요. 다시 눌러 주세요.');
  else {
    toast(data.message);
    if (data.code === 'bad_code' || data.code === 'no_student') { const p = profile; profile = null; saveProfile(null); $('#lName').value = p.name; $('#lPhone').value = fmtPhone(p.phone); showEntry('login'); }
  }
  await loadMine(); await load();
  if (data?.ok) window.scrollTo({ top: 0, behavior: 'smooth' });
});

async function loadMine(){
  if (!profile) return;
  const { data, error } = await sb.rpc('my_enrollments', { p_name: profile.name, p_phone: profile.phone });
  if (!error) { mine = data; if (state) renderBoard(); }
}
async function cancelMine(){
  const m = mine[0];
  if (!m || !confirm(`「${m.title}」 신청을 취소할까요?\n빈자리는 바로 다른 사람이 신청할 수 있어요.`)) return;
  const { data, error } = await sb.rpc('cancel_enrollment', { p_lecture_id: m.lecture_id, p_name: profile.name, p_phone: profile.phone });
  toast(error ? '취소에 실패했어요.' : data.message);
  await loadMine(); await load();
}

// 주기적 새로고침: 신청 중엔 자주, 아닐 땐 드물게
async function loop(){ await load(); setTimeout(loop, phase() === 'open' ? 5000 : 20000); }
setInterval(() => { if (state && profile && !$('#board').classList.contains('hidden')) renderStatus(); }, 250);
loop();
</script>
</body>
</html>
